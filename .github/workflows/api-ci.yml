
name: API CI

on:
  push:
    branches:
      - main
      - feature/security-and-tests
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API build and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://portal:portal@127.0.0.1:55432/portal_test
      REDIS_URL: redis://127.0.0.1:6379
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply test database migrations
        run: pnpm db:migrate

      - name: Verify database isolation
        run: |
          test "$DATABASE_URL" = \
            "postgres://portal:portal@127.0.0.1:55432/portal_test"

      - name: Run API security tests
        run: pnpm --filter @portal/api test

      - name: Build API
        run: pnpm --filter @portal/api build
